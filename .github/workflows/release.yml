name: Verificação e publicação do Meraki Flash
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/')
      && format('Lançamento do Meraki Flash — {0}', github.ref_name)
      || github.event_name == 'workflow_dispatch'
      && format('Verificação manual do Meraki Flash — {0}', github.ref_name)
      || format('Verificação do Meraki Flash — {0}', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux — AppImage e RPM
            platform: ubuntu-22.04
            bundles: appimage,rpm
          - name: Windows — instalador EXE
            platform: windows-latest
            bundles: nsis

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang gawk libappindicator3-dev \
            libclang-dev libssl-dev libtool libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config rpm librsvg2-dev xdg-utils

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Instalar dependências da interface
        run: npm ci

      - name: Testar interface e avisos de atualização
        run: npm test

      - name: Compilar interface
        run: npm run build

      - name: Testar motores de gravação
        run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml

      - name: Analisar o código Rust
        run: cargo clippy --locked --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Validar versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: >-
          node -e "const v = require('./src-tauri/tauri.conf.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + v) {
          throw new Error('A tag ' + process.env.GITHUB_REF_NAME +
          ' não corresponde à versão v' + v + ' do tauri.conf.json'); }"

      - name: Compilar e publicar instaladores
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meraki Flash ${{ github.ref_name }}
          releaseBody: Consulte as notas completas do lançamento após a conclusão dos builds.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  publish:
    name: Publicar nova versão
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Conferir os três instaladores e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets > assets.json
          node -e "const a=require('./assets.json').assets; for(const suffix of ['.AppImage','.rpm','-setup.exe']) if(!a.some(x=>x.name.endsWith(suffix)&&x.size>0)) throw Error('Artefato ausente: '+suffix)"
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file RELEASE_NOTES.md

